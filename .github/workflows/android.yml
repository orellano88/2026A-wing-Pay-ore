name: Build and Release WingPay Enterprise

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Copy APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk WingPay_v3010.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WingPay-APK
          path: WingPay_v3010.1.apk

  build-pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests pygame pillow qrcode edge-tts

      - name: Build with PyInstaller
        run: |
          cd RECEPTOR_PC
          pyinstaller --noconfirm --onefile --windowed --add-data "frases_exito.txt;." --name "WingPay_Receptor_PC" "RECEPTOR PC.pyw"

      - name: Upload PC Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WingPay-PC
          path: |
            RECEPTOR_PC/dist/WingPay_Receptor_PC.exe
            RECEPTOR_PC/frases_exito.txt
            RECEPTOR_PC/LanzarCentinela.vbs

  release:
    needs: [build-android, build-pc]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: WingPay-APK

      - name: Download PC Artifact
        uses: actions/download-artifact@v4
        with:
          name: WingPay-PC

      - name: Create Unified Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.apk
            WingPay_Receptor_PC.exe
            frases_exito.txt
            LanzarCentinela.vbs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
